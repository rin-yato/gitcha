name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      skip_npm:
        description: 'Skip NPM'
        required: false
        type: boolean
        default: true
      upload_release:
        description: 'Upload release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  # -------------------------------------------------------------------------
  # Binary builds
  # -------------------------------------------------------------------------
  binary:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            binary: gitcha
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            binary: gitcha
          - os: macos-latest
            target: bun-darwin-arm64
            binary: gitcha
          - os: windows-latest
            target: bun-windows-x64
            binary: gitcha.exe
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build binary
        run: bun run scripts/build-matrix.ts
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_OUTFILE: bin/${{ matrix.binary }}

      - name: Upload to Release
        if: github.event_name == 'release' || github.event.inputs.upload_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG=$(git describe --tags --abbrev=0)
          fi

          target=$(echo "${{ matrix.target }}" | sed 's/^bun-//')
          name="gitcha-$target"
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            name="$name.exe"
          fi
          mv "bin/${{ matrix.binary }}" "./$name"
          chmod +x "./$name"
          gh release upload "$TAG" "./$name" --clobber

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.upload_release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: bin/${{ matrix.binary }}

  # -------------------------------------------------------------------------
  # JS build for npm
  # -------------------------------------------------------------------------
  npm:
    name: Publish to npm
    if: github.event_name == 'release' || github.event.inputs.skip_npm != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build JS
        run: bun run scripts/build.ts

      - name: Configure npm auth
        run: npm config set //registry.npmjs.org/:_authToken=$NODE_AUTH_TOKEN
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: github.event_name == 'release' || github.event.inputs.skip_npm != 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
