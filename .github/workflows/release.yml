name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      skip_npm:
        description: 'Skip NPM publishing?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  # -------------------------------------------------------------------------
  # Binary builds
  # -------------------------------------------------------------------------
  binary:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            binary: gitcha
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            binary: gitcha
          - os: macos-latest
            target: bun-darwin-arm64
            binary: gitcha
          - os: windows-latest
            target: bun-windows-x64
            binary: gitcha.exe
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build binary
        run: bun run scripts/build-matrix.ts
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_OUTFILE: bin/${{ matrix.binary }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: bin/${{ matrix.binary }}

  # -------------------------------------------------------------------------
  # JS build for npm
  # -------------------------------------------------------------------------
  npm:
    name: Publish to npm
    if: github.event_name == 'release' || github.event.inputs.skip_npm != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build JS
        run: bun run scripts/build.ts

      - name: Configure npm auth
        run: npm config set //registry.npmjs.org/:_authToken=$NODE_AUTH_TOKEN
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # -------------------------------------------------------------------------
  # Create/Update GitHub release
  # -------------------------------------------------------------------------
  release:
    name: Create Release
    needs: [binary]
    if: always() && (needs.binary.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare and upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          for dir in artifacts/*/; do
            target=$(basename "$dir" | sed 's/^bun-//')
            for binary_path in "$dir"gitcha*; do
              filename=$(basename "$binary_path")
              extension="${filename##*.}"
              new_name="gitcha-$target"
              if [ "$extension" = "exe" ]; then new_name="$new_name.exe"; fi
              
              echo "Uploading $new_name to release $TAG..."
              mv "$binary_path" "./$new_name"
              chmod +x "./$new_name"
              gh release upload "$TAG" "./$new_name" --clobber
            done
          done
