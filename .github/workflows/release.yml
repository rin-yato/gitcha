name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  # -------------------------------------------------------------------------
  # Binary builds (goes to GitHub release)
  # -------------------------------------------------------------------------
  binary:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            binary: differ
          - os: macos-13
            target: bun-darwin-x64
            binary: differ
          - os: macos-14
            target: bun-darwin-arm64
            binary: differ
          - os: windows-latest
            target: bun-windows-x64
            binary: differ.exe
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build binary
        run: bun run scripts/build-matrix.ts
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_OUTFILE: bin/${{ matrix.binary }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: bin/${{ matrix.binary }}

  # -------------------------------------------------------------------------
  # JS build for npm (runs in parallel with binary)
  # -------------------------------------------------------------------------
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build JS
        run: bun run scripts/build.ts

      - name: Publish to npm
        run: bun publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  # -------------------------------------------------------------------------
  # Create GitHub release (runs after both binary and npm complete)
  # -------------------------------------------------------------------------
  release:
    name: Create Release
    needs: [binary, npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Make binaries executable
        run: chmod +x artifacts/*/differ*

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for binary in artifacts/*/differ*; do
            filename=$(basename "$binary")
            echo "Uploading $filename..."
            gh release upload "${{ github.event.release.tag_name }}" "$binary" --clobber
          done
