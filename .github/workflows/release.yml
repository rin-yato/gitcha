name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_npm:
        description: 'Publish to npm'
        required: false
        type: boolean
        default: false
      publish_release_assets:
        description: 'Upload release assets'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release tag to upload assets to'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Binary builds
  # -------------------------------------------------------------------------
  binary:
    name: Build ${{ matrix.release_name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            binary: gitcha
            release_name: gitcha-linux-x64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            binary: gitcha
            release_name: gitcha-linux-arm64
          - os: macos-14
            target: bun-darwin-arm64
            binary: gitcha
            release_name: gitcha-darwin-arm64
          - os: windows-latest
            target: bun-windows-x64
            binary: gitcha.exe
            release_name: gitcha-windows-x64.exe
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        shell: bash
        env:
          INSTALL_CPU: ${{ matrix.install_cpu }}
          INSTALL_OS: ${{ matrix.install_os }}
        run: |
          args=()

          if [ -n "$INSTALL_CPU" ]; then
            args+=(--cpu "$INSTALL_CPU")
          fi

          if [ -n "$INSTALL_OS" ]; then
            args+=(--os "$INSTALL_OS")
          fi

          bun install --frozen-lockfile "${args[@]}"

      - name: Build binary
        run: bun run scripts/build-matrix.ts
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_OUTFILE: bin/${{ matrix.binary }}

      - name: Stage release asset
        shell: bash
        run: |
          mkdir -p release-assets
          cp "bin/${{ matrix.binary }}" "release-assets/${{ matrix.release_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.release_name }}
          path: release-assets/${{ matrix.release_name }}
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Release assets
  # -------------------------------------------------------------------------
  release-assets:
    name: Upload release assets
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_release_assets)
    needs: binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            tag="$RELEASE_TAG"
          else
            tag="$INPUT_TAG"
          fi

          if [ -z "$tag" ]; then
            echo "release_tag is required when publish_release_assets is enabled for workflow_dispatch" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: gitcha-*
          merge-multiple: true

      - name: Upload to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(release-assets/*)

          if [ ${#files[@]} -eq 0 ]; then
            echo "No release assets found" >&2
            exit 1
          fi

          gh release upload "${{ steps.tag.outputs.tag }}" "${files[@]}" --clobber --repo "${{ github.repository }}"

  # -------------------------------------------------------------------------
  # JS build for npm
  # -------------------------------------------------------------------------
  npm:
    name: Publish to npm
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_npm)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      - name: Build JS
        run: bun run scripts/build.ts

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
